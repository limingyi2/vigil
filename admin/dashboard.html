    '<div class="dz-sub">或点击选择文件</div>';
  if (alive) {
    dz.addEventListener('click', () => {
      const inp = el('input', {type:'file', accept:'.zip,application/zip'});
      inp.style.display = 'none';
      document.body.appendChild(inp);
      inp.addEventListener('change', () => { doInstall(inp.files[0]); inp.remove(); });
      inp.click();
    });
  } else {
    dz.addEventListener('click', () =>
      toast('宿主没起来，先把 Node 和 skill_host 拉起来', 'error'));
  }
  ['dragenter','dragover'].forEach(ev => dz.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation(); dz.classList.add('drag');
  }));
  ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation();
    if (ev === 'dragleave' && dz.contains(e.relatedTarget)) return;
    dz.classList.remove('drag');
  }));
  dz.addEventListener('drop', e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    doInstall(f);
  });

  const extTxt = (st.ext || []).join(' ');
  wrap.appendChild(el('div', {class:'card', style:'margin-bottom:16px'}, [
    el('div', {class:'card-header'}, [
      el('h3', {}, '添加技能'),
      el('span', {class:'tag gray'}, 'zip 上传')
    ]),
    el('div', {class:'card-body'}, [
      dz,
      el('div', {class:'plug-note', style:'margin-top:12px'}, [
        '技能包长这样：',
        el('code', {}, '包名/包名/index.js'),
        '（两层或一层都行，宿主两种都认）。只准 ',
        el('code', {}, extTxt || '.js'),
        ' 这些后缀，',
        el('code', {}, '.py'),
        ' 不收 —— 那是插件那条通道。',
        el('ul', {}, [
          el('li', {}, '包里必须有个 index.js，宿主靠它当入口；没有会被直接拒掉。'),
          el('li', {}, '解压后超过 16MB / 单文件超 2MB / 文件数超 64 会被拒（有 zip 炸弹防护）。'),
          el('li', {}, '装完自动热重载宿主，不用重启大脑。'),
          el('li', {}, '同名重装会把旧版挪成 .bak_<时间戳>，不直接覆盖。'),
        ])
      ])
    ])
  ]));

  // ---- 已装列表 ----
  const listCard = el('div', {class:'card'});
  const list = el('div', {class:'plug-list'});
  listCard.appendChild(el('div', {class:'card-header'}, [
    el('h3', {}, '已安装的技能'),
    el('span', {class:'tag gray'}, (skills.length || 0) + ' 个')
  ]));
  listCard.appendChild(list);
  wrap.appendChild(listCard);

  function paint() {
    list.innerHTML = '';
    if (!alive) {
      list.appendChild(el('div', {class:'empty'},
        el('p', {}, '宿主没起来，看不到已装的技能。')));
      return;
    }
    if (!skills.length) {
      list.appendChild(el('div', {class:'empty'},
        el('p', {}, '一个技能都没装。拖一个 zip 到上面试试。')));
      return;
    }
    skills.forEach(s => list.appendChild(paintOne(s)));
    $('.tag.gray', listCard).textContent = skills.length + ' 个';
  }

  function paintOne(s) {
    const tools = s.tools || [];
    // 🔴 技能带 id 空值是个坏信号：list_skills() 连不上宿主时会塞一条
    // {"id":"", "name":"连不上 skill 宿主…"}。那不是"装了个无名技能"，
    // 按正常条目渲染会显示成一个空名字的条目，看着像列表坏了。
    const broken = !s.id;
    const name = el('div', {class:'fname'}, [
      s.name || s.id || '(无名)',
      broken ? el('span', {class:'tag danger'}, '读取失败')
             : el('span', {class:'tag success'}, '已装载')
    ]);
    const desc = el('div', {class:'fdesc'}, s.description || '（这个技能没写说明）');
    const mrow = el('div', {class:'fmeta'}, [
      broken ? null : el('code', {}, s.id),
      s.version ? el('span', {}, 'v' + s.version) : null,
      broken ? null : el('span', {}, '工具 ' + tools.length + ' 个')
    ]);
    const trow = tools.length ? el('div', {class:'skill-tools'},
      tools.map(t => el('span', {class:'skill-tool', title: t.desc || ''},
        (t.title || t.name || '?') + (t.name && t.title ? '（' + t.name + '）' : '')))) : null;

    const del = el('button', {class:'btn sm danger', onclick:async () => {
      const body = el('div', {style:'font-size:13px;line-height:1.8'}, [
        el('p', {}, '卸掉技能「' + (s.name || s.id) + '」？'),
        el('p', {style:'color:var(--text-secondary);font-size:12px;margin-top:8px'},
          '不会真删：目录会改名成 ' + s.id + '.bak_<时间戳>，'
          + '确认没问题之后可以自己删。已经写进她记忆里的东西不会跟着消失。')
      ]);
      showModal('卸载技能', '', '');
      $('#modalBody').innerHTML = ''; $('#modalBody').appendChild(body);
      const ok = el('button', {class:'btn danger', onclick:async () => {
        const r = await api('/api/skill/uninstall',
          {method:'POST', body:{skill: s.id}});
        closeModal();
        // 判据是 r && r.ok，不是"r 不是 null"：服务端带着理由拒掉时
        // （包名不合法、目录不存在）返回的是 {ok:false, err:...}
        if (r && r.ok) {
          skills = skills.filter(x => x.id !== s.id);
          paint();
          toast('已卸掉「' + (s.name || s.id) + '」', 'success');
          if (r.warn) toast(r.warn, 'info');
        } else {
          toast('卸不掉：' + ((r && r.err) || explainNetError(State.lastNetError)), 'error');
        }
      }}, '卸载');
      const cancel = el('button', {class:'btn', onclick:closeModal}, '算了');
      const f = $('#modalFooter'); f.innerHTML = ''; f.appendChild(cancel); f.appendChild(ok);
      $('#modalOverlay').classList.add('show');
    }}, '卸载');

    return el('div', {class:'plug-item', 'data-skill':s.id || ''}, [
      el('div', {class:'ficon', html:
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
        '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>'}),
      el('div', {class:'finfo'}, [name, desc, mrow, trow]),
      el('div', {class:'plug-actions'}, [del])
    ]);
  }

  paint();
  container.innerHTML = '';
  container.appendChild(wrap);

  // 拖到页面空白处也认。宿主没起来就不绑 —— 那时上传本身就没意义，
  // 绑了只是让用户以为能装。
  if (alive) bindWindowDrop(doInstall);
};

/* ===== 视图：朋友圈 & 日记 ===== */
Views.moments = async function(container) {
  container.innerHTML = '<div class="loading"><div class="spinner"></div>加载中…</div>';
  const [mData, dData] = await Promise.all([api('/api/moments'), api('/api/diary/list')]);
  const moments = (mData && mData.items) ? mData.items : [];
  const diaries = (dData && dData.items) ? dData.items : [];

  const wrap = el('div');
  // Tab 切换
  const tabBar = el('div', {style:'display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0'});
  const tabMoments = el('div', {style:'padding:8px 16px;cursor:pointer;font-size:13.5px;border-bottom:2px solid var(--brand);color:var(--brand);font-weight:500;margin-bottom:-1px'}, '朋友圈');
  const tabDiary = el('div', {style:'padding:8px 16px;cursor:pointer;font-size:13.5px;border-bottom:2px solid transparent;color:var(--text-secondary);margin-bottom:-1px'}, '日记');
  tabBar.appendChild(tabMoments);
  tabBar.appendChild(tabDiary);
  wrap.appendChild(tabBar);

  const momentsView = el('div');
  const diaryView = el('div', {style:'display:none'});

  // 朋友圈
  if (moments.length === 0) {
    momentsView.innerHTML = '<div class="empty"><p>暂无朋友圈</p></div>';
  } else {
    const card = el('div', {class:'card'});
    moments.forEach(m => {
      const item = el('div', {class:'moment-item'}, [
        el('div', {class:'moment-head'}, [
          el('div', {class:'moment-avatar'}, '夏'),
          el('div', {}, [
            el('div', {class:'moment-name'}, '知夏'),
            el('div', {class:'moment-time'}, m.time || '')
          ])
        ]),
        el('div', {class:'moment-text'}, m.text || m.content || ''),
        el('div', {class:'moment-actions'}, [
          el('span', {}, `♥ ${m.likes || 0}`),
          el('span', {}, `💬 ${(m.comments||[]).length}`),
        ])
      ]);
      card.appendChild(item);
    });
    momentsView.appendChild(card);
  }

  // 日记
  if (diaries.length === 0) {
    diaryView.innerHTML = '<div class="empty"><p>暂无日记</p></div>';
  } else {
    const list = el('div', {class:'diary-list'});
    diaries.forEach(d => {
      const item = el('div', {class:'diary-item'}, [
        el('div', {class:'diary-date'}, d.date || ''),
        el('div', {class:'diary-preview'}, d.preview || d.body || '')
      ]);
      item.addEventListener('click', async () => {
        const r = await api(`/api/diary/read?date=${d.date}`);
        const body = (r && r.body) ? r.body : (d.body || d.preview || '');
        showModal('日记 - ' + d.date,
          `<div style="white-space:pre-wrap;line-height:1.8;font-size:14px;color:var(--text)">${body}</div>`,
          '<button class="btn" onclick="closeModal()">关闭</button>'
        );
      });
      list.appendChild(item);
    });
    diaryView.appendChild(list);
  }

  wrap.appendChild(momentsView);
  wrap.appendChild(diaryView);

  tabMoments.addEventListener('click', () => {
    tabMoments.style.cssText = 'padding:8px 16px;cursor:pointer;font-size:13.5px;border-bottom:2px solid var(--brand);color:var(--brand);font-weight:500;margin-bottom:-1px';
    tabDiary.style.cssText = 'padding:8px 16px;cursor:pointer;font-size:13.5px;border-bottom:2px solid transparent;color:var(--text-secondary);margin-bottom:-1px';
    momentsView.style.display = '';
    diaryView.style.display = 'none';
  });
  tabDiary.addEventListener('click', () => {
    tabDiary.style.cssText = 'padding:8px 16px;cursor:pointer;font-size:13.5px;border-bottom:2px solid var(--brand);color:var(--brand);font-weight:500;margin-bottom:-1px';
    tabMoments.style.cssText = 'padding:8px 16px;cursor:pointer;font-size:13.5px;border-bottom:2px solid transparent;color:var(--text-secondary);margin-bottom:-1px';
    diaryView.style.display = '';
    momentsView.style.display = 'none';
  });

  container.innerHTML = '';
  container.appendChild(wrap);
};

/* ===== 视图：日志监控 ===== */
Views.logs = async function(container) {
  container.innerHTML = '<div class="loading"><div class="spinner"></div>加载中…</div>';
  const data = await api('/api/logs');
  const items = (data && data.items) ? data.items : [];

  // 更新 badge
  const errCount = items.filter(i => i.level === 'ERROR').length;
  const badge = $('#logBadge');
  if (errCount > 0) { badge.style.display = ''; badge.textContent = errCount; }
  else badge.style.display = 'none';

  const wrap = el('div');
  const bar = el('div', {class:'filter-bar'});
  bar.appendChild(el('span',{class:'label'},'级别'));
  const levelSel = el('select');
  levelSel.innerHTML = '<option value="">全部</option><option value="ERROR">ERROR</option><option value="WARN">WARN</option><option value="INFO">INFO</option>';
  bar.appendChild(levelSel);
  const searchInput = el('input', {type:'text', placeholder:'搜索日志…', style:'flex:1;min-width:160px'});
  bar.appendChild(searchInput);
  bar.appendChild(el('button', {class:'btn sm', onclick:()=>renderView('logs')}, '刷新'));
  bar.appendChild(el('button', {class:'btn sm danger', onclick:async()=>{
    if (!confirm('确定清空所有日志？')) return;
    const r = await api('/api/logs/clear', {method:'POST'});
    toast(r ? '日志已清空' : '清空失败', r?'success':'error');
    if (r) renderView('logs');
  }}, '清空日志'));
  wrap.appendChild(bar);

  const card = el('div', {class:'card'});
  const list = el('div', {id:'logList'});

  function renderLogs() {
    const lv = levelSel.value, kw = searchInput.value.toLowerCase();
    list.innerHTML = '';
    const filtered = items.filter(i => {
      if (lv && i.level !== lv) return false;
      if (kw && !(i.msg||'').toLowerCase().includes(kw)) return false;
      return true;
    });
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty"><p>无日志记录</p></div>';
      return;
    }
    filtered.forEach(i => {
      list.appendChild(el('div', {class:'log-item'}, [
        el('span', {class:'log-time'}, i.t || ''),
        el('span', {class:'log-level '+(i.level||'INFO')}, i.level || 'INFO'),
        el('span', {class:'log-msg'}, i.msg || '')
      ]));
    });
  }
  levelSel.addEventListener('change', renderLogs);
  searchInput.addEventListener('input', renderLogs);
  renderLogs();

  card.appendChild(list);
  wrap.appendChild(card);
  container.innerHTML = '';
  container.appendChild(wrap);
};

/* ===== 视图：系统配置 ===== */
Views.config = async function(container) {
  container.innerHTML = '<div class="loading"><div class="spinner"></div>加载中…</div>';
  const [mData, vData, stats] = await Promise.all([api('/api/models'), api('/api/voices'), api('/api/stats')]);

  const wrap = el('div');
  const twoCol = el('div', {class:'two-col'});
  wrap.appendChild(twoCol);

  // 模型配置
  // 🔴 /api/models 的 current 是**整个配置对象**（model_hub.public_current，
  // 跟 App 的 chat.html 共用，不能改它的结构），不是模型名字符串。
  // 直接丢给 el() 会渲染成一坨 [object Object]。这里取 .chat 才是模型名。
  const curModel = (mData && mData.current
      && typeof mData.current === 'object' ? mData.current.chat : mData.current)
      || (stats && stats.model) || '-';
  const modelCard = el('div', {class:'card'});
  modelCard.appendChild(el('div', {class:'card-header'}, [el('h3', {}, '聊天模型')]));
  const mBody = el('div', {class:'card-body'});
  mBody.appendChild(el('div', {style:'margin-bottom:14px;padding:10px 14px;background:var(--bg);border-radius:8px'}, [
    el('div', {style:'font-size:11.5px;color:var(--text-muted);margin-bottom:3px'}, '当前模型'),
    el('div', {style:'font-size:14px;font-weight:600;font-family:var(--mono)'}, String(curModel))
  ]));
  const modelList = el('div', {style:'display:flex;flex-direction:column;gap:8px'});
  const models = (mData && Array.isArray(mData.models) && mData.models.length)
      ? mData.models
      // 服务端没给可选列表时，自己列一份常见的。
      // 🔴 别只显示当前那一个 —— 那样面板看着是好的，但你没法切模型，
      // 会以为是配置被锁住了。当前项放第一个并标「当前」。
      : [
          { id: String(curModel), name: String(curModel) },
          { id: 'deepseek-ai/DeepSeek-V4-Flash', name: 'DeepSeek-V4-Flash（快、便宜）' },
          { id: 'zai-org/GLM-5.3', name: 'GLM-5.3' },
          { id: 'Qwen/Qwen3-8B', name: 'Qwen3-8B' },
        ].filter((m,i,a) => a.findIndex(x => x.id === m.id) === i);
  models.forEach(m => {
      const isCur = m.id === curModel;
      const item = el('div', {style:`display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid ${isCur?'var(--brand)':'var(--border)'};border-radius:8px;cursor:pointer;${isCur?'background:var(--brand-light)':''}`}, [
        el('div', {style:'flex:1'}, [
          el('div', {style:'font-size:13.5px;font-weight:500'}, m.name || m.id),
          el('div', {style:'font-size:11.5px;color:var(--text-muted);font-family:var(--mono);margin-top:2px'}, m.id)
        ]),
        isCur ? el('span',{class:'tag brand'},'当前') : el('button',{class:'btn sm primary',onclick:async(e)=>{
          e.stopPropagation();
          // 🔴 字段名必须是 chat —— 服务端 model_hub.apply_cfg 只认
          // provider/api_base/api_key/chat/vision/image/audio 这些。
          // 发 {model: id} 会走成「没有改动」，而这里却弹「已切换」，
          // 看着成功了其实模型没换（config.json 里那个 GLM 就是这么换不掉的）。
          const r = await api('/api/models/apply', {method:'POST', body:{chat:m.id}});
          const ok = r && r.ok !== false && !(r.changed && !r.changed.length);
          toast(ok ? `已切换到 ${m.name}` : '切换失败：' + ((r && (r.err || r.msg)) || '未知原因'), ok?'success':'error');
          if (ok) renderView('config');
        }}, '切换')
      ]);
      modelList.appendChild(item);
    });
  mBody.appendChild(modelList);
  modelCard.appendChild(mBody);
  twoCol.appendChild(modelCard);

  // 语音配置
  const voiceCard = el('div', {class:'card'});
  voiceCard.appendChild(el('div', {class:'card-header'}, [el('h3', {}, '语音引擎')]));
  const vBody = el('div', {class:'card-body'});
  vBody.appendChild(el('div', {style:'margin-bottom:14px;padding:10px 14px;background:var(--bg);border-radius:8px'}, [
    el('div', {style:'font-size:11.5px;color:var(--text-muted);margin-bottom:3px'}, '当前语音'),
    el('div', {style:'font-size:14px;font-weight:600'}, (stats && stats.voice) || '-')
  ]));
  const voiceList = el('div', {style:'display:flex;flex-direction:column;gap:8px'});
  if (vData && vData.voices) {
    vData.voices.forEach(v => {
      const isCur = v.id === vData.current;
      const item = el('div', {style:`display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid ${isCur?'var(--brand)':'var(--border)'};border-radius:8px;`}, [
        el('div', {style:'flex:1'}, [
          el('div', {style:'font-size:13.5px;font-weight:500'}, v.name || v.id),
          el('div', {style:'font-size:11.5px;color:var(--text-muted);margin-top:2px'}, v.provider || '')
        ]),
        el('button',{class:'btn sm',onclick:async()=>{
          const r = await api('/api/voice/preview', {method:'POST', body:{voice:v.id}});
          toast(r ? '预览已生成' : '预览失败', r?'success':'error');
        }}, '试听'),
        isCur ? el('span',{class:'tag brand'},'当前') : el('button',{class:'btn sm primary',onclick:async()=>{
          const r = await api('/api/voice/apply', {method:'POST', body:{voice:v.id}});
          toast(r ? `已切换到 ${v.name}` : '切换失败', r?'success':'error');
          if (r) renderView('config');
        }}, '切换')
      ]);
      voiceList.appendChild(item);
    });
  } else {
    voiceList.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">无法获取语音列表</div>';
  }
  vBody.appendChild(voiceList);
  voiceCard.appendChild(vBody);
  twoCol.appendChild(voiceCard);

  // 危险操作区
  const dangerCard = el('div', {class:'card'});
  dangerCard.appendChild(el('div', {class:'card-header'}, [el('h3', {style:'color:var(--danger)'}, '危险操作')]));
  const dBody = el('div', {class:'card-body', style:'display:flex;gap:10px;flex-wrap:wrap'});
  dBody.appendChild(el('button', {class:'btn danger', onclick:async()=>{
    if (!confirm('确定重置对话上下文？这会清空当前对话的短期记忆。')) return;
    const r = await api('/api/reset', {method:'POST'});
    toast(r ? '已重置' : '重置失败', r?'success':'error');
  }}, '重置对话上下文'));
  dBody.appendChild(el('button', {class:'btn danger', onclick:async()=>{
    if (!confirm('确定清空所有聊天历史？此操作不可恢复。')) return;
    const r = await api('/api/history/clear', {method:'POST'});
    toast(r ? '历史已清空' : '清空失败', r?'success':'error');
  }}, '清空聊天历史'));
  dBody.appendChild(el('button', {class:'btn danger', onclick:async()=>{
    if (!confirm('确定重置她的生活状态？这会清空 life_engine 的状态。')) return;
    const r = await api('/api/persona/reset_life', {method:'POST'});
    toast(r ? '生活状态已重置' : '重置失败', r?'success':'error');
  }}, '重置生活状态'));
  dangerCard.appendChild(dBody);
  wrap.appendChild(dangerCard);

  // 服务信息
  const infoCard = el('div', {class:'card', style:'margin-top:16px'});
  infoCard.appendChild(el('div', {class:'card-header'}, [el('h3', {}, '服务信息')]));
  const iBody = el('div', {class:'card-body'});
  const infoTable = el('table', {class:'data'});
  infoTable.innerHTML = '<colgroup><col style="width:30%"><col style="width:70%"></colgroup>';
  const infos = [
    ['服务地址', State.serverUrl],
    ['连接状态', State.demoMode ? '演示模式' : (State.connected ? '已连接' : '未连接')],
    ['Token', State.token ? '已配置 (' + State.token.slice(0,4) + '****)' : '未配置'],
    ['项目版本', 'Resident Agent'],
  ];
  infos.forEach(([k,v]) => infoTable.appendChild(el('tr',{},[el('td',{},k),el('td',{class:'mono'},v)])));
  iBody.appendChild(infoTable);
  infoCard.appendChild(iBody);
  wrap.appendChild(infoCard);

  container.innerHTML = '';
  container.appendChild(wrap);
};
</script>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vigil</title>
<style>
/* ============================================================================
   Vigil App —— 框架页（2026-10-08 改造）
   ----------------------------------------------------------------------------
   原版是完整的聊天 App（聊天 / 日记 / 朋友圈 / 人设 / 模型 / 语音 / 技能 / 日志…）。
   按改造计划，这一整套连同对应的人设与聊天数据都清掉了，只留**能连上服务器的壳子**，
   界面留待后续重做（方向：类 DeepSeek harness，能操作本地的那种客户端）。

   刻意保留的东西（改造时会用到，先删了以后得重写）：
     1. DEF_BASE / DEF_TOKEN / APP_CODE 三个占位常量 —— deploy/rebuild_apk.py
        构建时按正则注入地址、口令、版本号；名字或格式一变，注入会静默失败。
     2. api() 把 token 拼在 query 上，以及 authedFetch 走 Authorization 头
        （服务端两种都认；img/audio 设不了头，只能走 query）。
     3. window.Android.* 的调用（saveConn / installUpdate / toast…）
        —— MainActivity 用 @JavascriptInterface 注入，少一个就是 undefined。
     4. checkUpdate() 调 /api/app/version —— 版本提示机制还在用。
-->
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#f7f7f7; color:#191919; font-size:15px; }
body { display:flex; flex-direction:column; overflow:hidden; }

#top { flex:none; height:52px; background:#ededed; display:flex; align-items:center;
  justify-content:center; font-size:16px; border-bottom:.5px solid #dcdcdc; }
#stage { flex:1; overflow-y:auto; padding:18px 16px 40px; }
.card { background:#fff; border-radius:10px; padding:16px 14px; margin-bottom:14px; }
.card h2 { font-size:15px; margin-bottom:8px; }
.card p { font-size:13.5px; line-height:1.65; color:#555; }
.hint { font-size:12.5px; color:#888; margin-top:10px; line-height:1.6; }
.setrow { display:flex; align-items:center; gap:10px; margin-top:10px; }
.setrow .lab { flex:0 0 52px; font-size:13.5px; color:#555; }
.setrow input { flex:1; border:1px solid #e3e3e3; border-radius:8px; padding:9px 10px;
  font-size:14px; background:#fafafa; }
button { border:0; border-radius:8px; padding:10px 14px; font-size:14px; }
button.g { background:#07c160; color:#fff; }
button.d { background:#e9e9e9; color:#333; }
#connResult { font-size:12.5px; color:#666; margin-top:8px; min-height:18px; }
#toast { position:fixed; left:50%; top:14px; transform:translateX(-50%);
  background:rgba(0,0,0,.78); color:#fff; padding:8px 14px; border-radius:8px;
  font-size:13.5px; display:none; z-index:99; max-width:80%; text-align:center; }
</style>
</head>
<body>

<div id="top">Vigil</div>

<div id="stage">
  <div class="card">
    <h2>框架已就位</h2>
    <p>这一版只保留<b>连接与更新</b>能力：原来的聊天、日记、朋友圈、人设、模型面板
       都按改造计划移除了，界面留给下一步重做。</p>
    <p class="hint">下面的地址与口令填一次就存下来（网页版存 localStorage，
       安卓壳里写进 SharedPreferences，卸载才丢）。</p>
  </div>

  <div class="card">
    <h2>连接设置</h2>
    <div class="setrow"><span class="lab">地址</span>
      <input id="baseIn" placeholder="http://你的服务器:8788"></div>
    <div class="setrow"><span class="lab">口令</span>
      <input id="tokenIn" placeholder="token"></div>
    <div class="setrow">
      <button class="g" onclick="saveSetup()">保存</button>
      <button class="d" onclick="testConn()">测试连接</button>
    </div>
    <div id="connResult"></div>
  </div>

  <div class="card">
    <h2>版本</h2>
    <p class="hint" id="verLine">当前 v?（?）</p>
    <div class="setrow"><button class="d" onclick="checkUpdate(true)">检查更新</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* --- 占位常量：构建时注入，别手改（见文件头注释） --- */
const DEF_BASE  = '';   // 服务地址留空：首次打开在这里填（存本地，只需填一次）
const DEF_TOKEN = '';   // 鉴权 token 留空：同上，与服务端保持一致
const APP_CODE  = 0;   // 构建时由 deploy/rebuild_apk.py 从仓库根 version.json 注入

let BASE  = localStorage.getItem('zx_base')  || DEF_BASE;
let TOKEN = localStorage.getItem('zx_token') || DEF_TOKEN;

function $(id) { return document.getElementById(id); }

function api(p) {
  return BASE + p + (p.indexOf('?') >= 0 ? '&' : '?') +
         'token=' + encodeURIComponent(TOKEN);
}

/* 认证头 + 把 URL 上那份 token 摘掉 —— 拼在 URL 里会进访问日志和 Referer。 */
function authedFetch(u, opt) {
  opt = opt || {};
  opt.headers = opt.headers || {};
  if (TOKEN && typeof u === 'string' && u.indexOf(BASE) === 0) {
    opt.headers['Authorization'] = 'Bearer ' + TOKEN;
    u = u.replace(/([?&])token=[^&]*&?/g, '$1').replace(/[?&]$/, '');
  }
  return fetch(u, opt);
}

function tip(msg, ms) {
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(function () { t.style.display = 'none'; }, ms || 2600);
}

function saveSetup() {
  BASE  = ($('baseIn').value || '').trim().replace(/\/+$/, '') || DEF_BASE;
  TOKEN = ($('tokenIn').value || '').trim() || DEF_TOKEN;
  localStorage.setItem('zx_base', BASE);
  localStorage.setItem('zx_token', TOKEN);
  if (window.Android && window.Android.saveConn) {
    try { window.Android.saveConn(BASE, TOKEN); } catch (e) {}
  }
  tip('已保存');
}

async function testConn() {
  const el = $('connResult');
  el.textContent = '测试中…';
  try {
    const t0 = Date.now();
    const r = await authedFetch(api('/api/persona'));
    const d = await r.json();
    el.textContent = '✓ 连上了（' + (d.name || '未设人设') + '，' +
                     (Date.now() - t0) + 'ms）';
  } catch (e) {
    el.textContent = '✗ 连不上：' + ((e && e.message) || e);
  }
}

function showUpdDlg(name, url, note) {
  if (!confirm('发现新版本 ' + name + '\n' + (note || '') + '\n\n现在更新？')) return;
  if (window.Android && window.Android.installUpdate) {
    try {
      window.Android.installUpdate(url);
      tip('开始下载，完成后点通知安装', 4000);
      return;
    } catch (e) {}
  }
  window.open(url, '_blank');
}

async function checkUpdate(manual) {
  try {
    const r = await authedFetch(api('/api/app/version'));
    const d = await r.json();
    const mine = 'v' + (d.name || APP_CODE);
    if ((d.code || 0) > APP_CODE) {
      $('verLine').textContent = '当前 ' + mine + '，有新版本 ' + (d.name || d.code);
      showUpdDlg(d.name || ('v' + d.code), BASE + (d.url || '/api/app.apk'), d.note);
    } else {
      $('verLine').textContent = '当前 ' + mine + '（' + APP_CODE + '）· 已是最新';
      if (manual) tip('已经是最新版本啦');
    }
  } catch (e) {
    $('verLine').textContent = '版本号读取失败（连不上她？）';
    if (manual) tip('检查失败，稍后再试');
  }
}

/* --- 启动 --- */
$('baseIn').value  = BASE;
$('tokenIn').value = TOKEN;
if (!BASE) {
  $('connResult').textContent = '还没填地址 —— 填完点「保存」。';
} else {
  setTimeout(testConn, 250);
  checkUpdate(false);
}
</script>
</body>
</html>

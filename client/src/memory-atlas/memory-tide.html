    let memories=[],edges=[],selectedCluster='全部记忆',search='',hovered=null,pinned=null,rotX=-.06,rotY=.04,zoom=1,auto=!window.matchMedia('(prefers-reduced-motion: reduce)').matches,drag=null,lastTime=0,sourceKind='demo',flashIds=new Set(),toastTimer;

    function makeDemo(){const rand=rng(7331);const prototypes=Array.from({length:clusters.length},(_,c)=>Array.from({length:16},(_,j)=>Math.sin((c+1)*(j+2)*1.72)+Math.cos((c+3)*(j+1)*.91)));return demoTexts.map((row,i)=>{const category=groupFor(row[1]),ci=clusters.indexOf(category),v=prototypes[ci].map(x=>x+(rand()-.5)*1.15);return{id:'sample-'+i,text:row[0],category,tags:[row[1],...row[2].split(',')],created_at:new Date(Date.now()-((i*7)%90)*86400000).toISOString(),embedding:v,synthetic:true}})}

    function jacobi(matrix){const n=matrix.length,a=matrix.map(r=>r.slice()),v=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));for(let sweep=0;sweep<42;sweep++){let changed=0;for(let p=0;p<n-1;p++)for(let q=p+1;q<n;q++){const apq=a[p][q];if(Math.abs(apq)<1e-9)continue;changed++;const tau=(a[q][q]-a[p][p])/(2*apq),t=(tau>=0?1:-1)/(Math.abs(tau)+Math.sqrt(1+tau*tau)),c=1/Math.sqrt(1+t*t),s=t*c,app=a[p][p],aqq=a[q][q];a[p][p]=app-t*apq;a[q][q]=aqq+t*apq;a[p][q]=a[q][p]=0;for(let k=0;k<n;k++)if(k!==p&&k!==q){const akp=a[k][p],akq=a[k][q];a[k][p]=a[p][k]=c*akp-s*akq;a[k][q]=a[q][k]=s*akp+c*akq}for(let k=0;k<n;k++){const vkp=v[k][p],vkq=v[k][q];v[k][p]=c*vkp-s*vkq;v[k][q]=s*vkp+c*vkq}}if(!changed)break}return Array.from({length:n},(_,i)=>({value:a[i][i],vector:v.map(row=>row[i])})).sort((a,b)=>b.value-a.value)}
    function computeGraph(){if(!memories.length){edges=[];return}const dims=memories[0].embedding?.length||0;if(!dims){memories.forEach((m,i)=>m.pos=[Math.cos(i)*.6,Math.sin(i)*.6,0]);edges=[];return}const count=memories.length,means=Array(dims).fill(0);for(const m of memories)for(let d=0;d<dims;d++)means[d]+=m.embedding[d]/count;const centered=memories.map(m=>m.embedding.map((x,d)=>x-means[d]));if(count<2){memories[0].pos=[0,0,0]}else{const gram=centered.map(a=>centered.map(b=>a.reduce((s,x,d)=>s+x*b[d],0)));const eig=jacobi(gram).slice(0,3);const axes=Array.from({length:3},(_,k)=>eig[k]||{value:0,vector:Array(count).fill(0)});const raw=centered.map((_,i)=>axes.map(e=>e.vector[i]*Math.sqrt(Math.max(0,e.value))));const scales=Array.from({length:3},(_,k)=>Math.max(...raw.map(p=>Math.abs(p[k])),.0001));memories.forEach((m,i)=>m.pos=raw[i].map((x,k)=>x/scales[k]*.88))}

    function updateUI(){const cats=['全部记忆',...new Set(memories.map(m=>m.category||'未分类'))],list=$('#clusterList');list.innerHTML=cats.map((c,i)=>`<button class="cluster ${c===selectedCluster?'selected':''}" data-cluster="${escapeHtml(c)}"><i class="cluster-dot" style="color:${i?colors[(i-1)%colors.length]:'#9aa9b3'};background:currentColor"></i><span class="cluster-name">${escapeHtml(c)}</span><span class="cluster-count">${c==='全部记忆'?memories.length:memories.filter(m=>(m.category||'未分类')===c).length}</span></button>`).join('');list.querySelectorAll('.cluster').forEach(b=>b.onclick=()=>{selectedCluster=b.dataset.cluster;pinned=null;hovered=null;updateDetail(null);updateUI()});$('#clusterCount').textContent=`${Math.max(0,cats.length-1)} CLUSTERS`;$('#memoryTotal').textContent=String(memories.length).padStart(2,'0');$('#edgeTotal').textContent=String(edges.length).padStart(2,'0');$('#dataNote').innerHTML=sourceKind==='imported'?`真实向量 · ${memories[0]?.embedding.length||0}D → PCA 映射至 3D<br>连线显示每条记忆的 3 个最近邻（余弦相似度）`:'相似的记忆，在同一片光里相遇<br>当前使用浏览器内置的样例向量数据';$('#dimensionLabel').textContent=sourceKind==='imported'?`导入向量 · ${memories[0]?.embedding.length||0}D → 3D PCA`:'样例向量 · PCA 映射至 3D';$('#sourceBadge').textContent=sourceKind==='imported'?'JSON 向量库已载入':'本地演示数据';$('#storageLabel').textContent=sourceKind==='imported'?'JSON IMPORT':'LOCAL STORAGE';if(sourceKind==='imported'&&memories.some(m=>m.synthetic)){$('#sourceBadge').textContent='向量库 · 含演示新增';$('#dataNote').textContent='包含本地哈希演示向量；真实语义新增需要使用原嵌入模型生成向量。'}}
    function toast(message,undo){const el=$('#toast');el.textContent=message;el.classList.add('show');if(undo){const b=document.createElement('button');b.type='button';b.textContent='撤销';b.onclick=()=>{undo();el.classList.remove('show')};el.append(b);el.classList.add('has-action')}else el.classList.remove('has-action');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),undo?12000:2400)}
    function addMemory({text,category,tags}){const m={id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),text,category:category||'新记忆',tags,created_at:new Date().toISOString(),embedding:hashVec(text+' '+category+' '+tags.join(' '),memories[0]?.embedding.length||96),synthetic:true,localAdded:true,highlight:true,flashAt:performance.now()};memories.push(m);flashIds.add(m.id);computeGraph();persist();updateUI();pinned=memories.length-1;hovered=null;updateDetail(pinned);rotY=.04;toast('一段新记忆，已在光海中亮起',()=>{memories=memories.filter(item=>item.id!==m.id);flashIds.delete(m.id);pinned=null;hovered=null;computeGraph();persist();updateUI();updateDetail(null)})}
    function normalizeImport(payload){const items=Array.isArray(payload)?payload:payload?.memories;if(!Array.isArray(items)||!items.length)throw Error('JSON 应为记忆数组，或包含 memories 数组的对象');const parsed=items.map((x,i)=>{const text=x.text??x.content??x.memory;if(typeof text!=='string'||!text.trim())throw Error(`第 ${i+1} 条缺少 text/content/memory`);const embedding=x.embedding??x.vector;if(!Array.isArray(embedding)||!embedding.length||embedding.some(n=>!Number.isFinite(Number(n))))throw Error(`第 ${i+1} 条缺少有效 embedding 数组`);return{id:String(x.id??`import-${i}`),text:text.trim(),category:String(x.category??x.cluster??'未分类'),tags:Array.isArray(x.tags)?x.tags.map(String):[],created_at:x.created_at??x.timestamp??new Date().toISOString(),embedding:embedding.map(Number),synthetic:false}});const dim=parsed[0].embedding.length;if(parsed.some(m=>m.embedding.length!==dim))throw Error('所有 embedding 必须具有相同维度');if(parsed.length>100)throw Error('当前 Demo 最多导入 100 条记忆，以保证本地 PCA 流畅运行');return parsed}
    canvas.addEventListener('pointerdown',e=>{clearView();canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,rx:rotX,ry:rotY,moved:false}});canvas.addEventListener('pointermove',e=>{const rect=canvas.getBoundingClientRect();if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;rotY=drag.ry+dx*.006;rotX=Math.max(-1.45,Math.min(1.45,drag.rx+dy*.006));hovered=null;tooltip.classList.remove('show');return}const i=nearest(e.clientX-rect.left,e.clientY-rect.top),previous=hovered;hovered=i;if(i===null){tooltip.classList.remove('show');if(previous!==null)updateDetail(pinned)}else{if(i!==previous)updateDetail(i);showTooltip(points[i],e)}});canvas.addEventListener('pointerup',e=>{if(!drag)return;if(!drag.moved){const rect=canvas.getBoundingClientRect(),i=nearest(e.clientX-rect.left,e.clientY-rect.top);if(i!==null){pinned=pinned===i?null:i;updateDetail(pinned??i)}else{pinned=null;updateDetail(null)}}drag=null});canvas.addEventListener('pointerleave',()=>{if(!drag){hovered=null;tooltip.classList.remove('show');updateDetail(pinned)}});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.65,Math.min(1.8,zoom*(e.deltaY<0?1.08:.92)))},{passive:false});
    $('#rotateBtn').onclick=()=>{clearView();auto=!auto;updateRotationButton()};$('#zoomIn').onclick=()=>zoom=Math.min(1.8,zoom*1.12);$('#zoomOut').onclick=()=>zoom=Math.max(.65,zoom/1.12);$('#resetView').onclick=()=>{clearView();rotX=-.06;rotY=.04;zoom=1};$('#searchInput').addEventListener('input',e=>{search=e.target.value;hovered=null;pinned=null;updateDetail(null);tooltip.classList.remove('show')});
    function setNebula(enabled){nebulaEnabled=enabled;document.body.classList.toggle('nebula-on',enabled);$('#nebulaBtn').setAttribute('aria-checked',String(enabled));$('#nebulaBtn').title=enabled?'关闭星云效果':'开启星云效果';$('#sceneMood').textContent=enabled?'CRIMSON / 由内向外':'A LIVING ATLAS OF YOU';try{localStorage.setItem('memory-tide-nebula',enabled?'on':'off')}catch{}}
    $('#orbitView').onclick=()=>{const current=viewButtons.findIndex(id=>$('#'+id).getAttribute('aria-pressed')==='true');setView((current+1)%viewButtons.length)};
    $('#nebulaBtn').onclick=()=>setNebula(!nebulaEnabled);setNebula(nebulaEnabled);
    function setImmersive(enabled){document.body.classList.toggle('immersive',enabled);$('#immersiveText').textContent=enabled?'展开面板':'专注漫游';$('#immersiveBtn').setAttribute('aria-pressed',String(enabled));$('#immersiveBtn').setAttribute('aria-label',enabled?'展开面板':'专注漫游');requestAnimationFrame(resize)}
    $('#immersiveBtn').onclick=()=>setImmersive(!document.body.classList.contains('immersive'));
    window.addEventListener('keydown',e=>{if(e.key==='Escape')setImmersive(false)});
    $('#surpriseBtn').onclick=()=>{const candidates=memories.map((m,i)=>({m,i})).filter(x=>active(x.m));if(!candidates.length){toast('当前筛选没有可唤醒的记忆');return}pinned=candidates[Math.floor(Math.random()*candidates.length)].i;hovered=null;updateDetail(pinned);toast('已拾起一段记忆，相关路径正在亮起')};
    const backdrop=$('#modalBackdrop');$('#addBtn').onclick=()=>{backdrop.classList.add('open');$('#memoryContent').focus()};$('#closeModal').onclick=()=>backdrop.classList.remove('open');backdrop.addEventListener('click',e=>{if(e.target===backdrop)backdrop.classList.remove('open')});window.addEventListener('keydown',e=>{if(e.key==='Escape')backdrop.classList.remove('open')});$('#memoryForm').addEventListener('submit',e=>{e.preventDefault();const text=$('#memoryContent').value.trim();if(!text)return;addMemory({text,category:$('#memoryCategory').value.trim()||'新记忆',tags:$('#memoryTags').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean)});e.currentTarget.reset();$('#memoryCategory').value='新记忆';backdrop.classList.remove('open')});
    $('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const parsed=normalizeImport(JSON.parse(await file.text()));memories=parsed;sourceKind='imported';selectedCluster='全部记忆';pinned=hovered=null;computeGraph();updateUI();updateDetail(null);toast(`已载入 ${memories.length} 条真实向量记忆`)}catch(err){toast('导入失败：'+err.message)}finally{e.target.value=''}});
    updateRotationButton();
    const stored=loadLocal().map(m=>({...m,embedding:hashVec(m.text+' '+m.category+' '+(m.tags||[]).join(' '),16)}));memories=makeDemo().concat(stored);if(stored.length)memories.slice(-stored.length).forEach(m=>{m.flashAt=performance.now()-4000});computeGraph();updateUI();resize();new ResizeObserver(resize).observe(canvas);requestAnimationFrame(draw);
  })();
  </script>

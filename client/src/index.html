<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; media-src 'self' blob: http://127.0.0.1:*; frame-src http://127.0.0.1:*; connect-src http://127.0.0.1:*; object-src 'none'; base-uri 'none'">

<div class="app">
  <header class="titlebar">
    <button class="settings-return" id="settingsReturn" type="button" title="返回聊天" aria-label="返回聊天">
      <span aria-hidden="true">←</span><span>返回聊天</span>
    </button>
    <div class="wctl">
      <button id="winMin" title="最小化"><svg class="i xs"><use href="#i-minus"/></svg></button>
      <button id="winMax" title="最大化"><svg class="i xs"><use href="#i-sq"/></svg></button>
      <button class="close" id="winClose" title="关闭"><svg class="i xs"><use href="#i-x"/></svg></button>
    </div>
  </header>

  <!-- 全局功能图标栏；各页面保留原有入口。 -->
  <nav class="gnav" id="gnav"></nav>

  <div class="body">
    <aside class="panel" id="panel"></aside>
    <main class="main">
      <div class="topbar" id="topbar"></div>
      <div class="scroll" id="view"></div>
    </main>
    <div class="gutter" id="gPanel" role="separator" aria-orientation="vertical" tabindex="0" aria-label="调整列表栏宽度" title="拖动调整宽度 · 双击复位 · 方向键微调"></div>
    <!-- <div class="gutter" id="gChat" role="separator" aria-orientation="vertical" tabindex="0" aria-label="调整上下文栏宽度" title="拖动调整宽度 · 双击复位 · 方向键微调"></div> 已隐藏右侧分隔条 -->
  </div>

  <footer class="statusbar" id="status"></footer>
</div>
<div id="toast"></div>

<!-- 危险操作确认不再用全屏模态：直接做成聊天流里的一张气泡卡片
     （见 pages.js renderChat 的 confirm 气泡）。她要动这台电脑时，
     问题就落在你们正在聊的那条消息下面，允许/拒绝都在气泡里点。 -->

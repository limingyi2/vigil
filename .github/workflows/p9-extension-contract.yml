name: P9 extension contracts

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/p9-extension-contract.yml'
      - 'client/package.json'
      - 'client/package-lock.json'
      - 'client/electron/extension-manager.js'
      - 'client/electron/extension-manifest.schema.json'
      - 'client/tools/test-*.js'
      - 'docs/P9_*.md'
      - 'docs/schemas/extension-manifest.schema.json'
      - 'docs/examples/extensions/**'
      - 'wechat-bridge/UPSTREAM.json'
      - 'wechat-bridge/brain-plugin/gate.py'
      - 'brain/plugins/gate.py'
      - 'tests/test_p9_*.py'
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install client runtime dependencies only
        run: npm ci --prefix client --omit=dev
      - name: Validate Draft 2020-12 manifests and extension lifecycle
        run: npm run test:p9-extension --prefix client
      - name: Validate P9 documents, manifests and Bridge gate contract
        run: python -m unittest tests.test_p9_contract_artifacts tests.test_p9_bridge_contract

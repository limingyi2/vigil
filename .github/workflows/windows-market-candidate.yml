name: Windows plugin-market candidate

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/windows-market-candidate.yml'
      - 'brain/**'
      - 'client/**'
      - 'tests/**'
      - 'market.json'
      - 'market/**'
      - 'deploy/brain/vigil-brain.spec'
      - 'scripts/build_release.py'
      - 'docs/04-插件市场使用指南.md'
      - 'docs/USER_GUIDE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Brain build dependencies
        run: python -m pip install -r brain/requirements.txt pyinstaller pypdf
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Build the candidate installer (no extended acceptance suite)
        run: python scripts/build_release.py --candidate
      - name: Verify installer against build manifest
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD 'client/dist-release'
          $manifest = Get-Content (Join-Path $releaseDir 'release-manifest.json') -Raw | ConvertFrom-Json
          $installer = Join-Path $releaseDir $manifest.setup_file
          $contents = [System.IO.Path]::ChangeExtension($installer, '.contents.json')
          if (-not $manifest.candidate) { throw 'Expected an unpublished candidate build' }
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Installer missing: $installer" }
          if (-not (Test-Path -LiteralPath $contents -PathType Leaf)) { throw "Installer contents manifest missing: $contents" }
          $file = Get-Item -LiteralPath $installer
          if ($file.Length -ne [long]$manifest.size) { throw 'Installer size does not match release-manifest.json' }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne ([string]$manifest.sha256).ToLowerInvariant()) { throw 'Installer SHA-256 does not match release-manifest.json' }
          Write-Output "Verified $($manifest.setup_file) ($($file.Length) bytes, SHA-256 $hash)"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: vigil-windows-plugin-market-code30
          # electron-builder 同时产出 nsis 安装器、portable 便携版和差分更新用的
          # blockmap。历史上正式 release 会把三者一起挂上去，客户端的
          # public-updates 只读 release-manifest.json 指向的安装器，但便携版是
          # 用户在没有安装权限时的备用入口 —— 只上传 Setup.* 会把它丢掉。
          path: |
            client/dist-release/Vigil.Setup.*.exe
            client/dist-release/Vigil.Setup.*.exe.blockmap
            client/dist-release/Vigil.*.exe
            client/dist-release/release-manifest.json
            client/dist-release/Vigil.Setup.*.contents.json
          if-no-files-found: error
          retention-days: 14

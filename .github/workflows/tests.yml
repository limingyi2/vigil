name: tests

# 这个仓库以前一个自动化测试都没有：效果全靠"日常使用观察"，
# 于是 LOOP_MAX 未定义、rollup 不删源文件丢内容这类问题都只能等出事了
# 才发现。现在至少纯逻辑那部分有回归网了。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    name: 单元测试（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 跑测试
        run: python -m pytest tests -q --junitxml=test-results.xml

      - name: Semantic retrieval settings JS syntax
        run: node --check client/src/js/pages.js

      - name: 共享订阅与 Creator 界面回归
        if: always()
        run: node --test client/tools/test-p2-stream-lifecycle.js client/tools/test-unified-runtime.js client/tools/test-public-updates.js

      - name: 保存测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: test-results.xml

  syntax:
    name: 全仓语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # compileall 只编译不执行，所以不需要装 psutil / fastembed 也能把
      # brain 的语法兜住（测试路径 import 不到那些文件）。
      - name: 编译 brain/ 下所有模块
        run: |
          python -m compileall -q brain
          echo "compileall OK"

  rag-acceptance:
    name: RAG 混合检索真实 FAISS 验收
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 FAISS + 嵌入依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install faiss-cpu fastembed numpy

      - name: 检查 FAISS 是否可用
        id: faiss-check
        run: |
          python -c "import faiss; print('FAISS', faiss.__version__)" || echo "faiss_unavailable=true" >> $GITHUB_OUTPUT

      - name: 运行 RAG 验收测试（真实 FAISS）
        if: steps.faiss-check.outputs.faiss_unavailable != 'true'
        env:
          RAG_ACCEPTANCE_FORCE_FAISS: "1"
        run: |
          cd brain
          python ../test_rag_acceptance.py

      - name: FAISS 不可用时明确标记
        if: steps.faiss-check.outputs.faiss_unavailable == 'true'
        run: |
          echo "::warning::FAISS not available in CI, RAG ANN acceptance tests were NOT executed"
          echo "This is a known limitation - ANN-specific tests require faiss-cpu"

      - name: 保存测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-acceptance-results
          path: test_result*.txt

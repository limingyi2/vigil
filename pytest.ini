[pytest]
# 收集范围固定在正式测试目录：
# - tests/ ：CI（unittest discover -s tests）同源
# - brain/ ：模块自带的 test_*.py 回归（如 planner 授权、插件安装）
# 显式排除评测工件区——vigil-eval 的 workspace、docs/evaluation 的 fixture、
# results/ 下的 A0x 运行副本里有 test_*.py，但那是"被评测的项目"，
# 让 pytest 收集它们会报一堆 src 导入错误（2026-10-11 实锤）。
testpaths = tests brain
addopts = -q
